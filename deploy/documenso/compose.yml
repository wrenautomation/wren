# Documenso (AGPL, run unmodified) for Wren's e-signatures: designs/2026-10-21-esign-and-newsletter.md.
# It needs about 520 MB with its database, so it does not go on the database box. Put it on a
# host with 2 GB. Caddy holds the only public ports and gets the certificate for DOCUMENSO_HOST.
# The env file next to this one (README.md, "Set up") holds every ${...} below. Documenso sends no
# email: Wren mails the signing link, and every Documenso email is off on each envelope it makes.
services:
  # Documenso's own Postgres.
  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: documenso
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso"]
      interval: 10s
      retries: 6
    mem_limit: 256m
  # Documenso: Wren's e-signatures.
  app:
    image: documenso/documenso:v2.21.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${ENCRYPTION_SECONDARY_KEY:?}
      NEXT_PUBLIC_WEBAPP_URL: https://${DOCUMENSO_HOST:?}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_DATABASE_URL: postgres://documenso:${DB_PASSWORD}@db:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://documenso:${DB_PASSWORD}@db:5432/documenso
      # The seal: the PDF is signed with this .p12 (base64, one line) and its passphrase.
      NEXT_PRIVATE_SIGNING_TRANSPORT: local
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS: ${SIGNING_P12_BASE64:?}
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${SIGNING_PASSPHRASE:?}
      # No outbound mail. Documenso still wants an SMTP setting to start; this one goes nowhere.
      NEXT_PRIVATE_SMTP_HOST: 127.0.0.1
      NEXT_PRIVATE_SMTP_PORT: "2500"
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: no-mail@${DOCUMENSO_HOST}
      NEXT_PRIVATE_SMTP_FROM_NAME: Wren
      # Make the first account (README), then set this to "true" and run `docker compose up -d`.
      NEXT_PUBLIC_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 1200m
  # TLS for DOCUMENSO_HOST; holds the only public ports.
  caddy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOCUMENSO_HOST: ${DOCUMENSO_HOST:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
volumes:
  pgdata:
  caddy-data:
