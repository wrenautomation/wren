# The RackNerd VPS: the SMTP prober (AWS will not open outbound port 25) and, on box 1
# alone (`--profile search`), a SearXNG metasearch for the research engine. Caddy holds the
# only public ports and terminates TLS for each name, so a bearer token never crosses the
# internet in the clear; the services themselves are not published.
# The box's env file (/opt/wren-vps) holds PROBE_TOKEN (SSM /wren/prod/probe_token) and
# PROBE_HOST, the box's own name: its TLS name and its HELO, which its IP's PTR must match.
# Box 1 adds SEARCH_HOST, SEARXNG_TOKEN (SSM /wren/prod/searxng_token, what a caller sends)
# and SEARXNG_SECRET (SSM /wren/prod/searxng_secret, the instance's own cookie key).
name: wren-vps
services:
  prober:
    image: public.ecr.aws/docker/library/node:22-alpine
    command: ["node", "/app/prober.mjs"]
    restart: unless-stopped
    environment:
      PROBE_PORT: "2525"
      PROBE_HELO: ${PROBE_HOST:?}
      PROBE_TOKEN: ${PROBE_TOKEN:?}
      # Twice the pool-feeder's walk width (PROBE_WIDTH): room for a hand run alongside.
      PROBE_MAX_IN_FLIGHT: "64"
      # Google/Microsoft/Proofpoint/Mimecast inbound: 3 conversations at once, each with
      # the 1.5s gap. One lane made Google's single host the pace of a whole list.
      PROBE_BIG_HOST_LANES: "3"
    volumes:
      - ./prober.mjs:/app/prober.mjs:ro
  searxng:
    # A dated tag (hub.docker.com/r/searxng/searxng/tags); `latest` moves daily.
    image: docker.io/searxng/searxng:2026.10.27-ef7bae9dd
    profiles: [search]
    restart: unless-stopped
    # The box has 961 MB for everything: one worker, a hard cap, no Valkey.
    mem_limit: 350m
    environment:
      SEARXNG_BASE_URL: https://${SEARCH_HOST:?}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?}
      SEARXNG_LIMITER: "false"
      SEARXNG_IMAGE_PROXY: "false"
      GRANIAN_WORKERS: "1"
      GRANIAN_BLOCKING_THREADS: "4"
      UWSGI_WORKERS: "1"
      UWSGI_THREADS: "4"
    volumes:
      - ./searxng.yml:/etc/searxng/settings.yml:ro
  caddy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PROBE_HOST: ${PROBE_HOST:?}
      SEARCH_HOST: ${SEARCH_HOST:-}
      SEARXNG_TOKEN: ${SEARXNG_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # One file per extra site; the deploy script ships search.caddy to box 1 alone.
      - ./sites:/etc/caddy/sites:ro
      - caddy-data:/data
    depends_on: [prober]
volumes:
  caddy-data:
