services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: wren
      POSTGRES_DB: wren
      POSTGRES_PASSWORD: ${WREN_DB_PASSWORD:-wren}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wren"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
