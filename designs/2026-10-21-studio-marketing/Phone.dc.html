<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio on the phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#f3f1ec;color:#0e0e0e;font-family:"Figtree",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0e0e0e;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:transparent;border:0;color:#63645e}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#f3f1ec;overflow:hidden;border-radius:44px;position:relative">

  <div style="padding:58px 20px 0;display:flex;flex-direction:column;gap:4px">
    <div style="font-size:13px;color:#63645e;font-weight:500">Studio · this week</div>
    <h1 style="margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em">5 pieces still due</h1>
  </div>

  <div style="padding:16px 20px 0;display:flex;gap:10px;overflow-x:auto">
    <div style="flex:none;width:150px;background:#fff;border-radius:6px 20px 6px 20px;box-shadow:0 0 0 1px rgba(14,14,14,.11);padding:12px 14px;display:flex;flex-direction:column;gap:4px">
      <span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#63645e"><span aria-hidden="true" style="width:8px;height:8px;border-radius:2px;background:#6a5a93;display:inline-block"></span>Offer builder</span>
      <span style="font-size:15px;font-weight:600">Single post</span><span style="font-size:12px;color:#b7791f;font-weight:600">X · today</span></div>
    <div style="flex:none;width:150px;background:#fff;border-radius:6px 20px 6px 20px;box-shadow:0 0 0 1px rgba(14,14,14,.11);padding:12px 14px;display:flex;flex-direction:column;gap:4px">
      <span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#63645e"><span aria-hidden="true" style="width:8px;height:8px;border-radius:2px;background:#2f8a80;display:inline-block"></span>Reactivation</span>
      <span style="font-size:15px;font-weight:600">Carousel</span><span style="font-size:12px;color:#63645e">LinkedIn · Wed</span></div>
    <div style="flex:none;width:150px;background:#fff;border-radius:6px 20px 6px 20px;box-shadow:0 0 0 1px rgba(14,14,14,.11);padding:12px 14px;display:flex;flex-direction:column;gap:4px">
      <span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#63645e"><span aria-hidden="true" style="width:8px;height:8px;border-radius:2px;background:#6a5a93;display:inline-block"></span>Offer builder</span>
      <span style="font-size:15px;font-weight:600">Long video</span><span style="font-size:12px;color:#63645e">YouTube · Thu</span></div>
  </div>

  <div style="padding:18px 20px 0;display:flex;align-items:center;gap:10px">
    <h2 style="margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#63645e">Waiting · 5</h2>
    <a href="Main.dc.html" style="margin-left:auto;font-size:13px;color:#6a5a93;font-weight:500">By line</a>
  </div>

  <div style="margin:10px 20px 0;background:#fff;border-radius:6px 20px 6px 20px;box-shadow:0 0 0 1px rgba(14,14,14,.11);overflow:hidden;flex:1;min-height:0">
    <sc-for list="{{drafts}}" as="d" hint-placeholder-count="5">
      <div style="display:flex;align-items:center;gap:12px;padding:10px 8px 10px 14px;border-bottom:1px solid rgba(14,14,14,.11);min-height:56px;box-sizing:border-box">
        <span aria-hidden="true" style="width:30px;height:30px;border-radius:5px 11px 5px 11px;background:{{d.tint}};display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:11px;font-weight:700;color:{{d.color}}">{{d.kind}}</span>
        <a href="Compose.dc.html" style="display:flex;flex-direction:column;min-width:0;flex:1">
          <span style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{d.title}}</span>
          <span style="font-size:12px;color:{{d.ageColor}};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{d.slot}} · {{d.age}}</span></a>
        <button class="ic" aria-label="Approve {{d.title}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5l3 3 7-7"/></svg></button>
      </div>
    </sc-for>
    <div style="padding:10px 14px;font-size:12px;color:#63645e">5 drafts · 1 past its slot</div>
  </div>

  <a href="Compose.dc.html" aria-label="New post" style="position:absolute;right:20px;bottom:104px;width:56px;height:56px;border-radius:14px 28px 14px 28px;background:#6a5a93;color:#faf7f2;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -8px rgba(40,30,70,.5)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4v14M4 11h14"/></svg></a>

  <nav aria-label="Tabs" style="margin-top:12px;padding:10px 12px 28px;border-top:1px solid rgba(14,14,14,.11);background:#fff;display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:4px">
    <a href="Offer.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;font-weight:500;color:#63645e"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12h12M2 8h12M2 4h12"/></svg>Map</a>
    <a href="Inbound.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;font-weight:500;color:#63645e"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 9l2-5h8l2 5v4H2z"/><path d="M2 9h4l1 2h2l1-2h4"/></svg>Inbox</a>
    <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;font-weight:600;color:#6a5a93"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 13l1-4 7-7 3 3-7 7z"/><path d="M10 3l3 3"/></svg>Studio</a>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;font-weight:500;color:#63645e"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13c.6-2.5 2.4-3.7 4.5-3.7s3.9 1.2 4.5 3.7"/></svg>People</a>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;font-weight:500;color:#63645e"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="4" width="12" height="9" rx="1.5"/><path d="M2 7.5h12"/></svg>Money</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = {
      core: { color: '#6a5a93', tint: 'rgba(106,90,147,.12)' },
      front: { color: '#2f8a80', tint: 'rgba(47,138,128,.12)' },
      out: { color: '#3d78b8', tint: 'rgba(61,120,184,.12)' },
      client: { color: '#c0567f', tint: 'rgba(192,86,127,.12)' }
    };
    const drafts = [
      { kind: 'P', title: 'Why one offer page beats a services list', slot: 'Tue 09:00', age: '2d', l: L.core, late: false },
      { kind: 'V', title: 'Build an offer in 11 minutes', slot: 'Thu 15:00', age: '4d', l: L.core, late: true },
      { kind: 'C', title: 'Five texts that bring old clients back', slot: 'Wed 09:00', age: '1d', l: L.front, late: false },
      { kind: 'T', title: 'The audit I run before any ad spend', slot: 'Mon 18:00', age: '6h', l: L.out, late: false },
      { kind: 'B', title: 'What a client sees in week one', slot: 'Fri', age: '3d', l: L.client, late: false }
    ].map((d) => ({ ...d, color: d.l.color, tint: d.l.tint, ageColor: d.late ? '#b7791f' : '#63645e' }));
    return { drafts };
  }
}
</script>
</body>
</html>
