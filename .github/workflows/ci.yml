name: ci
on:
  push: { branches: [main] }
  pull_request:
# Many sessions push to main: a newer push cancels the older run's checks, and deploy
# follows the newest green one. The gates run side by side on turbo's remote cache, so a
# package nobody touched is not retested. Deploy waits only for the gates (2026-10-22: push
# to live in minutes). Story tests and integration (integration.yml) report on their own and
# never hold a deploy. The deploy job is never cancelled: a newer run waits for it.
jobs:
  gates:
    strategy:
      fail-fast: true
      matrix: { gate: [lint, unit, schema] }
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    concurrency: { group: "ci-${{ github.ref }}-${{ matrix.gate }}", cancel-in-progress: true }
    # The shared remote cache (deploy/terraform/turbo-cache.tf); without secrets, local only.
    env:
      TURBO_API: ${{ secrets.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: wren
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/gates.sh ${{ matrix.gate }}
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          WREN_TEST_PG_IMAGE: mirror.gcr.io/library/postgres:17
  # Every @wren/ui story as a test: it renders, its play runs, axe checks it
  # (designs/2026-10-17-storybook-visual-tests.md). The image brings Chromium.
  stories:
    name: test:stories
    runs-on: ubuntu-24.04-arm
    concurrency: { group: "ci-${{ github.ref }}-stories", cancel-in-progress: true }
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      TURBO_API: ${{ secrets.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: wren
    steps:
      - uses: actions/checkout@v5
      # The container's user is not the checkout's owner: git (and turbo's hashing) want it trusted.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }
      # The portal's page stories need the portal and all it imports; that holds @wren/ui.
      - run: pnpm install --frozen-lockfile --filter wren --filter "@wren/portal..."
      - run: ./scripts/gates.sh visual
  deploy:
    needs: gates
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions: { id-token: write, contents: read }
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
