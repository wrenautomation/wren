name: integration
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
# Every package's integration suite and the spam score.
# Reports only: deploy follows ci.yml, so a red run here is fixed in the next batch.
concurrency: { group: "integration-${{ github.ref }}", cancel-in-progress: true }
jobs:
  integration:
    runs-on: ubuntu-latest
    # The shared remote cache (deploy/terraform/turbo-cache.tf), the Mac's gates write it too.
    # A fork's PR gets no secrets: turbo then uses the local cache only.
    env:
      TURBO_API: ${{ secrets.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: wren
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }
      # The turbo cache is saved after every run, red or cancelled too: turbo writes only the
      # tasks that passed. A save on green only made the run after a red one restore an older
      # cache and retest 23 of 26 packages (91903b9b, 10-17).
      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-integration-${{ github.sha }}
          restore-keys: turbo-integration-
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/gates.sh integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          WREN_TEST_PG_IMAGE: mirror.gcr.io/library/postgres:17
      # Every run restores the last cache and adds to it: entries no run used for a week go.
      - if: always()
        run: find .turbo/cache -type f -atime +7 -delete 2>/dev/null || true
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-integration-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
