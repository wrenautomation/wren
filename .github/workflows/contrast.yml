name: contrast
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
# The axe color-contrast scan: every portal page in every look, all text at 4.5:1
# (designs/2026-10-14-customerio-audit.md, B3 item 11). The preview runs on an empty migrated
# database. Reports only: deploy follows ci.yml.
concurrency: { group: "contrast-${{ github.ref }}", cancel-in-progress: true }
jobs:
  contrast:
    # The Playwright image brings Chromium and its libraries (10-22: installing them took 8 min).
    runs-on: ubuntu-24.04-arm
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env: { POSTGRES_USER: wren, POSTGRES_PASSWORD: wren, POSTGRES_DB: wren }
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      WREN_DATABASE_URL: postgres://wren:wren@postgres:5432/wren
      PORT: "8788"
    steps:
      - uses: actions/checkout@v5
      # The container's user is not the checkout's owner: git wants it trusted.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/install
      - run: pnpm db:migrate
      - name: Start the preview
        working-directory: apps/portal
        run: |
          nohup pnpm -s preview > preview.log 2>&1 &
          for _ in $(seq 120); do node -e 'fetch(`http://localhost:${process.env.PORT}/`).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))' && exit 0; sleep 2; done
          cat preview.log; exit 1
      - run: npx tsx scripts/contrast.ts --out contrast.json
        working-directory: apps/portal
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast
          path: |
            apps/portal/contrast.json
            apps/portal/preview.log
          if-no-files-found: ignore
