# Deploy main to production: deploy/scripts/deploy.sh, one step, independent work at once.
# ci.yml starts it beside the gates; deploy.sh builds, then waits for lint and schema
# before it changes anything live (a newer run or 20 min ends the wait). By hand: `gh workflow run deploy.yml --ref main` (no wait).
# Secrets (production environment): AWS_DEPLOY_ROLE_ARN,
# LAMBDA_NAME, WREN_DATABASE_URL, WREN_API_HOST, WREN_API_TOKEN,
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, AUTH_LAMBDA_URL, AUTH_EDGE_SECRET,
# LIVE_HOOK_SECRET, BOX_BUCKET, BOX_INSTANCE_ID.
# See deploy/README.md, deploy/phone.md, deploy/portal.md, designs/2026-10-06-llm-gateway.md.
name: deploy
on:
  workflow_call:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
  actions: read
jobs:
  deploy:
    runs-on: ${{ vars.WORK_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    # One deploy at a time, never cancelled midway; the newest waiting one replaces older ones.
    concurrency: { group: deploy, cancel-in-progress: false }
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: deploy
        run: bash deploy/scripts/deploy.sh
        env:
          WREN_DATABASE_URL: ${{ secrets.WREN_DATABASE_URL }}
          LAMBDA_NAME: ${{ secrets.LAMBDA_NAME }}
          BOX_BUCKET: ${{ secrets.BOX_BUCKET }}
          BOX_INSTANCE_ID: ${{ secrets.BOX_INSTANCE_ID }}
          WREN_API_HOST: ${{ secrets.WREN_API_HOST }}
          WREN_API_TOKEN: ${{ secrets.WREN_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LAMBDA_URL: ${{ secrets.AUTH_LAMBDA_URL }}
          EDGE_SECRET: ${{ secrets.AUTH_EDGE_SECRET }}
          LIVE_HOOK_SECRET: ${{ secrets.LIVE_HOOK_SECRET }}
          GH_TOKEN: ${{ github.token }}
