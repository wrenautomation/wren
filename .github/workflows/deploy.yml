# Deploy main to production: migrate the database, ship the worker and the
# sign-in to Lambda, register the worker's new version with Restate Cloud, ship
# the phone, sign-in and portal Workers to Cloudflare. Runs after `ci` is green.
# Secrets (production environment): AWS_DEPLOY_ROLE_ARN, AWS_INVOKE_ROLE_ARN,
# LAMBDA_NAME, WREN_DATABASE_URL, RESTATE_HOST, RESTATE_AUTH_TOKEN,
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, AUTH_LAMBDA_URL, AUTH_EDGE_SECRET.
# See deploy/README.md, deploy/phone.md, deploy/portal.md.
name: deploy
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: migrate
        run: pnpm db:migrate
        env: { WREN_DATABASE_URL: "${{ secrets.WREN_DATABASE_URL }}" }
      - name: bundle
        run: |
          pnpm --filter @wren/worker build:lambda
          pnpm --filter @wren/auth-app build:lambda
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: publish lambda version
        id: publish
        run: |
          aws lambda update-function-code --function-name "$LAMBDA_NAME" \
            --zip-file fileb://apps/worker/dist/lambda.zip --publish --output json > out.json
          # A versioned ARN, whichever form the response's FunctionArn takes.
          base="$(jq -r .FunctionArn out.json | sed -E 's/:[0-9]+$//')"
          echo "arn=$base:$(jq -r .Version out.json)" >> "$GITHUB_OUTPUT"
        env: { LAMBDA_NAME: "${{ secrets.LAMBDA_NAME }}" }
      - name: register with restate cloud
        run: |
          npx -y @restatedev/restate deployments register -y \
            "${{ steps.publish.outputs.arn }}" \
            --assume-role-arn "${{ secrets.AWS_INVOKE_ROLE_ARN }}"
        env:
          RESTATE_HOST_SCHEME: https
          RESTATE_HOST: ${{ secrets.RESTATE_HOST }}
          RESTATE_AUTH_TOKEN: ${{ secrets.RESTATE_AUTH_TOKEN }}
      - name: ship the sign-in lambda
        # Its function URL serves $LATEST; no version to publish.
        run: |
          aws lambda update-function-code --function-name wren-prod-auth \
            --zip-file fileb://apps/auth/dist/lambda.zip > /dev/null
          aws lambda wait function-updated --function-name wren-prod-auth
      - name: deploy the phone worker
        working-directory: apps/phone
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: deploy the sign-in worker
        working-directory: apps/auth
        run: |
          pnpm run build
          jq -n --arg url "$LAMBDA_URL" --arg edge "$EDGE_SECRET" '{LAMBDA_URL: $url, EDGE_SECRET: $edge}' \
            > "$RUNNER_TEMP/auth-secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/auth-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LAMBDA_URL: ${{ secrets.AUTH_LAMBDA_URL }}
          EDGE_SECRET: ${{ secrets.AUTH_EDGE_SECRET }}
      - name: deploy the portal worker
        working-directory: apps/portal
        run: |
          pnpm run build
          jq -n --arg url "https://$RESTATE_HOST:8080/" --arg token "$RESTATE_AUTH_TOKEN" \
            '{RESTATE_INGRESS_URL: $url, RESTATE_AUTH_TOKEN: $token}' > "$RUNNER_TEMP/portal-secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/portal-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESTATE_HOST: ${{ secrets.RESTATE_HOST }}
          RESTATE_AUTH_TOKEN: ${{ secrets.RESTATE_AUTH_TOKEN }}
