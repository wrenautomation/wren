# Deploy: see deploy/portal.md. Nothing secret lives here: RESTATE_INGRESS_URL,
# RESTATE_AUTH_TOKEN, LAMBDA_URL, EDGE_SECRET are secrets (deploy.yml); the account id comes from
# CLOUDFLARE_ACCOUNT_ID.
name = "wren-portal"
main = "src/worker.ts"
compatibility_date = "2026-09-27"
# Only the hosts below.
workers_dev = false

# app. is the clients' portal (sign-in at auth.), demo. the public demo. `*/*` takes each
# client's own host (Cloudflare for SaaS): designs/2026-10-06-custom-domains.md. Our other
# proxied hosts stay off it by their own routes (deploy/scripts/custom-domains.sh).
routes = [
  { pattern = "app.wrenautomation.com", custom_domain = true },
  { pattern = "demo.wrenautomation.com", custom_domain = true },
  { pattern = "*/*", zone_name = "wrenautomation.com" },
  # Sites' data pages on the apex (designs/2026-10-07-sites.md): the lander keeps every other
  # path. Lands with the next portal deploy; nothing else on the zone changes.
  { pattern = "wrenautomation.com/o/*", zone_name = "wrenautomation.com" },
]

[vars]
DEMO_HOST = "demo.wrenautomation.com"
AUTH_ORIGIN = "https://auth.wrenautomation.com"
APP_HOST = "app.wrenautomation.com"

# The Worker decides first: /api is code, the rest is the built app.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# Live notes: one room per open note (src/live.ts). SQLite-backed class, though the room keeps
# nothing on disk: the doc lives in Postgres.
[[durable_objects.bindings]]
name = "NOTE_ROOM"
class_name = "NoteRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NoteRoom"]

# One cap per visitor on public posts: forms, chat, signing, booking, AI tools (src/limit.ts).
[[ratelimits]]
name = "PUBLIC_LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
