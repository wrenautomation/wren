<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wren SMS" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Wren SMS</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/app.css" />

    <header class="bar">

    <main id="view" aria-live="polite"></main>

    <nav id="tabs" class="tabs" hidden>
      <a href="#/inbox" data-tab="inbox">Inbox</a>
      <a href="#/numbers" data-tab="numbers">Numbers</a>
      <a href="#/templates" data-tab="templates">Templates</a>
      <a href="#/stats" data-tab="stats">Stats</a>
    </nav>

    <script src="/app.js" type="module"></script>
