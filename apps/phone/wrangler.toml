# Deploy: see deploy/phone.md. Nothing secret lives here: SESSION_SECRET,
# SETUP_TOKEN, TELNYX_PUBLIC_KEY, RESTATE_INGRESS_URL and RESTATE_AUTH_TOKEN are `wrangler secret put`,
# and the account id comes from CLOUDFLARE_ACCOUNT_ID in the environment.
name = "wren-phone"
main = "src/worker.ts"
compatibility_date = "2026-09-27"

# A custom domain: Cloudflare makes the DNS record and certificate.
routes = [{ pattern = "phone.wrenautomation.com", custom_domain = true }]

# The Worker decides first: /api, /auth and /webhooks are code, the rest is public/.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Made 2026-09-28 by `npx wrangler kv namespace create wren-phone-creds`.
[[kv_namespaces]]
binding = "CREDS"
id = "30a6cf3636ce4570a63753d1a63678fc"
